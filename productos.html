<h2>Registro de Productos</h2>

<form action="guardarProducto.php"
method="POST"
onsubmit="return validarProducto()">

<label for="nombre">Nombre</label>
<input type="text"
id="nombre"
name="nombre"
placeholder="Nombre">

<label for="descripcion">Descripción</label>
<input type="text"
id="descripcion"
name="descripcion"
placeholder="Descripción">

<label for="precio">Precio</label>
<input type="number"
step="0.01"
id="precio"
name="precio">

<label for="stock">Stock</label>
<input type="number"
id="stock"
name="stock">

<input type="submit"
value="Guardar Producto">

</form>

<script src="./validaProductos.js"></script>
